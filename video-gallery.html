    <style>
        .video-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }

        .video-gallery video {
            width: 100%;
            max-width: 300px;
            height: auto;
            cursor: pointer;
        }

        .video-container {
            width: 100%;
            max-width: 300px;
        }

        @media (max-width: 768px) {
            .video-gallery {
                flex-direction: column;
                align-items: center;
            }

            .video-container {
                width: 90%;
            }
        }
    </style>
</head>
